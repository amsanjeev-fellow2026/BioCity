<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioCity: Build a Healthy World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#CFEEFB;--panel:#FFFFFF;--ink:#1D2B38;--mut:#52646F;--line:#D3E1E9;--ok:#176B46;--okbg:#E2F5EA;--no:#8A4B00;--nobg:#FFF0D6;--inf:#244C99;--infbg:#E4EDFC;--btn:#17775A;--btnink:#FFFFFF;--sky1:#A5DCF8;--sky2:#E3F6FF;--chip:#EEF5F8;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E202D;--panel:#17303E;--ink:#EAF4F8;--mut:#A9BEC9;--line:#2C4858;--ok:#7FDDAA;--okbg:#15392B;--no:#F5BE70;--nobg:#3B2D12;--inf:#A9C3F7;--infbg:#16294B;--btn:#34B88A;--btnink:#04261B;--sky1:#12354B;--sky2:#1D4B65;--chip:#1F3B4A}}
:root[data-theme="dark"]{--bg:#0E202D;--panel:#17303E;--ink:#EAF4F8;--mut:#A9BEC9;--line:#2C4858;--ok:#7FDDAA;--okbg:#15392B;--no:#F5BE70;--nobg:#3B2D12;--inf:#A9C3F7;--infbg:#16294B;--btn:#34B88A;--btnink:#04261B;--sky1:#12354B;--sky2:#1D4B65;--chip:#1F3B4A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
body.board{font-size:1.18em}
h1,h2,h3,.disp{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid #F5B301;outline-offset:2px;border-radius:8px}
svg [data-act]:focus-visible{outline:none}
svg [data-act]:focus-visible .hit{stroke:#F5B301;stroke-width:5}
.mut{color:var(--mut)}
.top{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;padding:.55rem 1rem;background:var(--panel);border-bottom:3px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{display:flex;align-items:center;gap:.5rem;font-family:Fredoka,sans-serif;font-weight:700;font-size:1.35rem}
.logo i{font-style:normal;font-size:1.6rem}
.chip{background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:.2rem .75rem;font-weight:700;font-size:.85rem;white-space:nowrap}
.chip.obj{max-width:34rem;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.btn{border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:.55rem 1.05rem;min-height:48px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--btn)}
.btn.go{background:var(--btn);border-color:var(--btn);color:var(--btnink);font-size:1.05rem}
.btn.sm{min-height:40px;padding:.3rem .8rem;font-size:.9rem}
.btn.ghost{background:transparent}
.iconbtn{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:var(--panel);font-size:1.25rem;display:grid;place-items:center;padding:0}
.wrap{max-width:1500px;margin:0 auto;padding:1rem}
.card{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:1rem 1.1rem}
.card h3{font-size:1.1rem;margin-bottom:.5rem}
.citygrid{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1rem;align-items:start}
@media (max-width:1000px){.citygrid{grid-template-columns:1fr}}
.mapbox{background:linear-gradient(var(--sky1),var(--sky2));border:3px solid var(--line);border-radius:24px;padding:.4rem;overflow:hidden}
.map{display:block;width:100%;height:auto}
.map [data-act]{cursor:pointer}
.map .locked,.map .off{cursor:not-allowed}
.pl1{font:600 18px Fredoka,sans-serif;fill:#fff}
.pl2{font:700 13px "Atkinson Hyperlegible",sans-serif;fill:#fff;opacity:.95}
.hallt{font:600 14px Fredoka,sans-serif;fill:#fff}
.maplegend{display:flex;gap:1rem;flex-wrap:wrap;padding:.4rem .8rem .5rem;font-size:.85rem;font-weight:700;color:var(--mut)}
.side{display:grid;gap:.8rem}
.meter{margin:.45rem 0}
.meter .row{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.bar{height:16px;border-radius:99px;background:var(--chip);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .45s}
.meter small{display:block;color:var(--mut);font-size:.78rem}
.olist{list-style:none;margin:0;padding:0;display:grid;gap:.35rem;font-size:.95rem}
.olist li{display:flex;gap:.5rem;align-items:flex-start}
.olist .cur{background:var(--infbg);border:2px solid var(--inf);border-radius:12px;padding:.4rem .6rem;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;text-align:center;font-size:.7rem;font-weight:700}
.badges .b{border:3px dashed var(--line);border-radius:14px;padding:.35rem .1rem;opacity:.55}
.badges .b.on{border-style:solid;border-color:#F5B301;opacity:1;background:var(--nobg)}
.badges .b span{display:block;font-size:1.5rem}
.upg{display:flex;flex-wrap:wrap;gap:.35rem}
.upg span{border:2px solid var(--line);border-radius:10px;padding:.15rem .5rem;font-size:.8rem;font-weight:700;opacity:.5}
.upg span.on{opacity:1;background:var(--okbg);border-color:var(--ok)}
.news{font-size:.88rem;display:grid;gap:.3rem;color:var(--mut)}
.score{display:flex;gap:.4rem;flex-wrap:wrap}
/* district */
.dband{color:#fff;border-radius:22px;padding:1.2rem 1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.dband .em{font-size:3.4rem}
.dband h1{font-size:2rem}
.dband p{margin:.3rem 0 0;max-width:46rem;font-size:1.02rem}
.mlist{display:grid;gap:.7rem}
.mrow{display:flex;gap:1rem;align-items:center;border:3px solid var(--line);border-left:10px solid var(--dc);border-radius:18px;background:var(--panel);padding:.8rem 1rem}
.mrow .ic{font-size:2rem}
.mrow h3{font-size:1.15rem}
.tag{display:inline-block;background:var(--chip);border:2px solid var(--line);border-radius:8px;padding:0 .45rem;font-size:.75rem;font-weight:700;margin-left:.3rem}
.tag.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tag.skip{background:var(--nobg);border-color:var(--no);color:var(--no)}
/* mission */
.mhead{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;background:var(--dk);color:#fff;border-radius:20px;padding:.8rem 1.1rem;margin-bottom:.9rem}
.mhead .btn{color:var(--ink)}
.mhead h1{font-size:1.6rem}
.mhead .kick{font-size:.85rem;font-weight:700;opacity:.9}
.rs{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
.rs span{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);border-radius:999px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.mgrid{display:grid;grid-template-columns:19rem minmax(0,1fr);gap:.9rem;align-items:start}
@media (max-width:900px){.mgrid{grid-template-columns:1fr}}
.story p{margin:.2rem 0 .7rem}
.story .obj{border-left:6px solid var(--dc);padding-left:.6rem}
.hint{background:var(--infbg);border:2px solid var(--inf);color:var(--inf);border-radius:12px;padding:.5rem .7rem;margin-top:.6rem;font-weight:700;font-size:.92rem}
.safetybox{background:var(--nobg);border:2px solid var(--no);color:var(--no);border-radius:12px;padding:.5rem .7rem;margin:.4rem 0 .7rem;font-size:.88rem;font-weight:700}
.tctl{margin-top:.8rem;display:flex;gap:.4rem;flex-wrap:wrap}
body.board .tctl{display:none}
.stage{min-height:22rem}
.prog{font-weight:700;color:var(--mut);margin-bottom:.4rem}
.q{font-size:1.35rem;margin:.1rem 0 .8rem}
.q2{font-size:1.15rem;margin:1rem 0 .6rem}
.bonus{font-family:"Atkinson Hyperlegible";font-size:.75rem;background:#FFE08A;color:#4A3500;border-radius:8px;padding:.1rem .45rem;vertical-align:middle}
.opts{display:grid;gap:.55rem}
.opt{text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:.8rem 1rem;font-weight:700;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--btn)}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--nobg);border-color:var(--no);opacity:.75}
.fb{margin-top:.9rem;border-radius:18px;padding:0;font-size:1.02rem}
.fb:not(:empty){padding:.85rem 1.1rem;border:3px solid var(--line);background:var(--panel)}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.no{background:var(--nobg);border-color:var(--no)}
.fb.info{background:var(--infbg);border-color:var(--inf)}
.fb .go{margin-top:.6rem}
.fxrow{margin-top:.5rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.fxchip{background:var(--panel);border:2px solid var(--ok);color:var(--ok);border-radius:999px;padding:0 .6rem;font-weight:700;font-size:.85rem}
.fxwhy{font-size:.88rem;color:var(--mut)}
.pickbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.coins{background:#FFF2C2;color:#4A3500;border:2px solid #E9C54B;border-radius:999px;padding:.15rem .8rem;font-weight:700}
.tray{display:flex;gap:.4rem;min-height:3rem;align-items:center;background:var(--chip);border:3px dashed var(--line);border-radius:16px;padding:.3rem .7rem;margin-bottom:.7rem}
.slot{font-size:1.8rem}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.2rem,1fr));gap:.6rem}
.food{display:grid;gap:.1rem;justify-items:center;text-align:center;border:3px solid var(--line);background:var(--panel);border-radius:18px;padding:.6rem .4rem;min-height:9rem}
.food.on{border-color:var(--btn);background:var(--okbg)}
.food .fe{font-size:2.3rem}
.food .cost{font-size:.8rem;font-weight:700;color:var(--mut)}
.food .tg{display:flex;gap:.2rem;flex-wrap:wrap;justify-content:center}
.food .tg em{font-style:normal;font-size:.68rem;border:2px solid var(--line);border-radius:7px;padding:0 .3rem;color:var(--mut)}
.food .tg em.m{background:var(--infbg);border-color:var(--inf);color:var(--inf);font-weight:700}
.note{background:var(--chip);border-radius:12px;padding:.5rem .8rem;margin:.7rem 0;min-height:2.6rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.mi{display:block;width:100%;text-align:left;border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:.6rem .8rem;margin-bottom:.5rem;font-weight:700}
.mi.sel{border-color:#F5B301;background:#FFF6D6;color:#3b2d00}
.mi.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);cursor:default}
.mi.shake{animation:shake .35s}
.mi small{display:block;font-weight:400;color:var(--mut)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem}
.bin{border:3px dashed var(--line);border-radius:16px;background:var(--panel);padding:.6rem;min-height:9rem;text-align:left}
.bin:hover:not(:disabled){border-color:var(--btn)}
.bin b{display:block}
.bin small{display:block;color:var(--mut);margin:.15rem 0 .4rem;font-size:.8rem}
.bin .pl{display:block;font-size:.85rem;font-weight:700;color:var(--ok)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem;margin-bottom:.8rem}
.smp{border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:.5rem;text-align:center;font-weight:700}
.smp .fe{font-size:2.2rem;display:block}
.smp.sel{border-color:#F5B301;background:#FFF6D6;color:#3b2d00}
.smp.ok{border-color:var(--ok);background:var(--okbg)}
.card2{background:var(--chip);border-radius:16px;padding:.7rem .9rem;margin-bottom:.6rem}
.card2 p{margin:.15rem 0}
.causes{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.5rem}
.wbars{display:grid;gap:.5rem;margin:.6rem 0}
.wbars .bar{height:22px}
.kit{width:100%;height:auto;border-radius:16px;border:3px solid var(--line);display:block}
.kit [data-act]{cursor:pointer}
.kpanel{margin-top:.7rem}
.bmi input{font:inherit;font-weight:700;width:7.5rem;padding:.4rem .6rem;border-radius:10px;border:3px solid var(--line);background:var(--panel);color:var(--ink)}
.bmi label{font-weight:700;margin-right:.6rem}
.bmi .res{font-size:1.4rem;font-weight:700;margin:.5rem 0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.5rem;align-items:center;min-height:80vh}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:3.4rem;letter-spacing:-.01em}
.hero h2{font-size:1.6rem;margin:.3rem 0 1rem;color:var(--mut)}
.hero p{max-width:34rem}
.credit{margin-top:1.4rem;font-size:.85rem;color:var(--mut)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.guide{display:flex;gap:1.2rem;align-items:center}
.guide .face{font-size:5rem}
.bubble{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:1.2rem 1.4rem;font-size:1.15rem;max-width:40rem}
.cert{text-align:center;border:8px double #E0A800;background:var(--panel);border-radius:24px;padding:1.5rem}
.cert h1{font-size:2.4rem}
.ctable{width:100%;border-collapse:collapse;margin:.8rem 0;text-align:left}
.ctable td{border-bottom:2px solid var(--line);padding:.4rem .5rem;font-weight:700}
.mback{position:fixed;inset:0;background:rgba(10,25,35,.62);display:grid;place-items:center;z-index:50;padding:1rem;overflow:auto}
.modal{background:var(--panel);border:4px solid var(--line);border-radius:24px;padding:1.2rem 1.4rem;max-width:34rem;width:100%;max-height:92vh;overflow:auto}
.modal.wide{max-width:60rem}
.modal h2{font-size:1.6rem;margin-bottom:.6rem}
.modal .fld{margin:.8rem 0}
.modal .fld>b{display:block;margin-bottom:.3rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{border:3px solid var(--line);background:var(--panel);border-radius:12px;padding:.35rem .8rem;font-weight:700;min-height:44px}
.seg button.on{border-color:var(--btn);background:var(--okbg);color:var(--ok)}
.pv{border-top:2px solid var(--line);padding:.5rem 0;font-size:.9rem}
.pv b{font-size:1rem}
.pv ul{margin:.2rem 0 0 1.1rem;padding:0}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:.4rem;pointer-events:none}
.toast{background:#17324A;color:#fff;border-radius:999px;padding:.45rem 1.1rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* map motion */
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(220px)}}
.car1{animation:d1 14s linear infinite}
.car2{animation:d2 17s linear infinite}
@keyframes d1{from{transform:translate(270px,170px)}to{transform:translate(730px,430px)}}
@keyframes d2{from{transform:translate(730px,170px)}to{transform:translate(270px,430px)}}
.smoke{animation:rise 3s ease-out infinite}
@keyframes rise{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.pulse2{animation:pulse2 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{50%{transform:scale(1.18)}}
.flame{animation:flick .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scaleY(1.2)}}
@media (prefers-reduced-motion:reduce){.cloud,.car1,.car2,.smoke,.pulse,.pulse2,.flame,.toast,.mi.shake{animation:none}.bar>i{transition:none}.car1{transform:translate(400px,270px)}.car2{transform:translate(620px,230px)}}
@media print{.top,.btn,.no-print{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================
   BioCity: Build a Healthy World  (Grade 5 Science, Ch.1 Food)
   Single-file game. No network needed after loading.
   ===================================================== */
const KEY='biocity.v1';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------------- content ---------------- */
const DIST=[
 {id:'nutrition',name:'Nutrition District',e:'🍎',c:'#F28C28',dk:'#9A4607',plate:'#F9DFB0',badge:'Nutrition Architect',blurb:'Food pyramid and balanced diet',story:"The town's new grocery market is opening. The city needs a reliable supply of foods that can contribute to a balanced diet."},
 {id:'security',name:'Food Security District',e:'🥫',c:'#14A6A0',dk:'#0A6460',plate:'#C2EBE6',badge:'Food Guardian',blurb:'Spoilage and preservation',story:'A food delivery has arrived at the storage centre. Some food needs to be preserved, and one storage area has developed a spoilage problem.'},
 {id:'wellbeing',name:'Well-being District',e:'🌳',c:'#3E7BDB',dk:'#1F4A96',plate:'#BDE6AE',badge:'Well-being Planner',blurb:'Obesity, diseases and healthy living',story:'The town is planning a community well-being programme. Use science to help people make informed choices about food, activity and disease prevention.'},
 {id:'safety',name:'Safety District',e:'🧯',c:'#E4493B',dk:'#1B3580',plate:'#CCD8F4',badge:'Safety Inspector',blurb:'Kitchen safety',story:'The community kitchen is about to open, but the safety inspector has found hazards that must be fixed first.'}
];
const RES=[
 {k:'food',n:'Food Security',e:'🌾',c:'#14A6A0',d:'Safe, suitable food for the community'},
 {k:'health',n:'Health',e:'💚',c:'#4CAF50',d:'Nutrition and healthy-living choices'},
 {k:'safety',n:'Safety',e:'🛡️',c:'#E4493B',d:'Safe kitchens and hazard prevention'},
 {k:'well',n:'Community Well-being',e:'☀️',c:'#3E7BDB',d:'Less waste and a thriving community'}
];
const RES0={food:70,health:65,safety:80,well:70};
const UPG=[
 {id:'garden',n:'Community garden',e:'🥕',at:20},{id:'storage',n:'Improved food storage',e:'🏭',at:60},
 {id:'market',n:'Better-equipped market',e:'🛒',at:100},{id:'park',n:'Recreation park',e:'⚽',at:140},
 {id:'kitchen',n:'Safer kitchen',e:'🧑‍🍳',at:180},{id:'deco',n:'Fountain and trees',e:'⛲',at:220}
];
const MAINN={carb:'Carbohydrates',protein:'Proteins',fat:'Fats',vm:'Vitamins and minerals'};
const TAGN={carb:'Carbohydrates',protein:'Proteins',fat:'Fats',vit:'Vitamins',mineral:'Minerals'};
const FOODS=[
 {id:'rice',e:'🍚',n:'Rice',main:'carb',t:['carb'],c:2,note:'Rice is rich in carbohydrates, which give the body energy.'},
 {id:'grains',e:'🌾',n:'Whole grains',main:'carb',t:['carb','vit'],c:2,note:'Whole grains give carbohydrates for energy and some vitamins.'},
 {id:'potato',e:'🥔',n:'Potatoes',main:'carb',t:['carb'],c:1,note:'Potatoes are a carbohydrate food that gives energy.'},
 {id:'pulses',e:'🫘',n:'Pulses',main:'protein',t:['protein','mineral'],c:2,note:'Pulses are a good source of proteins, which help the body grow and repair itself. They also give some minerals.'},
 {id:'milk',e:'🥛',n:'Milk',main:'protein',t:['protein','fat','mineral'],c:2,note:'Milk gives proteins, some fats and minerals. One food can belong to more than one group.'},
 {id:'eggs',e:'🥚',n:'Eggs',main:'protein',t:['protein','fat','vit'],c:2,note:'Eggs give proteins, some fats and vitamins.'},
 {id:'nuts',e:'🥜',n:'Nuts',main:'fat',t:['fat','protein','mineral'],c:3,note:'Nuts give fats (a lot of energy in a small amount) and also some proteins and minerals.'},
 {id:'ghee',e:'🧈',n:'Ghee and oil',main:'fat',t:['fat'],c:2,note:'Ghee and oil are fats. We need them, but only in small amounts.'},
 {id:'fruit',e:'🍎',n:'Fruits',main:'vm',t:['vit','mineral'],c:2,note:'Fruits give vitamins and minerals that protect the body from deficiency diseases.'},
 {id:'veg',e:'🥦',n:'Vegetables',main:'vm',t:['vit','mineral'],c:1,note:'Vegetables give vitamins and minerals. Green leafy vegetables are especially useful.'},
 {id:'sweets',e:'🍬',n:'Sweets',main:'carb',t:['carb'],c:1,lim:true,note:'Sweets mostly give sugar. They are fine as a rare treat in small amounts, but they do not replace healthy foods.'},
 {id:'chips',e:'🍟',n:'Fried chips',main:'fat',t:['fat','carb'],c:1,lim:true,note:'Fried chips are high in fat. Enjoy only now and then in small amounts.'}
];

const prog=id=>{const r=reqM(id);return{done:r.filter(m=>G.done[m.id]).length,total:r.length}};

const level=()=>1+Object.keys(G.badges).length+(G.finalDone?1:0);
function dState(i){const d=DIST[i];if(G.badges[d.id])return'done';if(S.mode==='single')return d.id===S.district?'open':'off';return(i===0||G.badges[DIST[i-1].id])?'open':'locked';}
function curObj(){for(let i=0;i<DIST.length;i++){const s=dState(i);if(s==='open'){const m=reqM(DIST[i].id).find(m=>!G.done[m.id]);if(m)return{m,d:DIST[i]};}}
 if(S.mode==='full'&&DIST.every(d=>G.badges[d.id])&&!G.finalDone)return{m:{title:'Healthy City Certification'},d:null,fin:true};return null;}

function ensureTeams(){if(G.teamPts.length!==S.teams)G.teamPts=Array.from({length:S.teams},(_,i)=>G.teamPts[i]||0);}

function bad(tag){tag=tag||(RT.m&&RT.m.tag);if(tag)G.review[tag]=(G.review[tag]||0)+1;RT.wrong++;save();}
function applyFx(fx,why){if(!fx||RT.replay)return'';let out='';for(const r of RES){const v=fx[r.k];if(!v)continue;const o=G.res[r.k];const n=clamp(o+v);G.res[r.k]=n;const dl=n-o;RT.fx[r.k]=(RT.fx[r.k]||0)+dl;if(dl)out+='<span class="fxchip">'+r.e+' '+r.n+' '+(dl>0?'+':'')+dl+'</span>';}
 if(out){news(RES.filter(r=>fx[r.k]).map(r=>r.n+' '+(fx[r.k]>0?'+':'')+fx[r.k]).join(', ')+(why?' – '+why:''));}save();return out?'<div class="fxrow">'+out+'<span class="fxwhy">'+(why||'')+'</span></div>':'';}

/* ---------------- isometric drawing ---------------- */
function shade(hex,p){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;const f=c=>Math.round(p<0?c*(1+p):c+(255-c)*p);return'#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const pts=P=>P.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
function blk(cx,cy,sw,h,col,o){o=o||{};const a=sw/2,b=sw/4;
 const T=[[cx,cy-b-h],[cx+a,cy-h],[cx,cy+b-h],[cx-a,cy-h]],L=[[cx-a,cy-h],[cx,cy+b-h],[cx,cy+b],[cx-a,cy]],R=[[cx+a,cy-h],[cx,cy+b-h],[cx,cy+b],[cx+a,cy]];
 return'<polygon points="'+pts(L)+'" fill="'+shade(col,-.12)+'"/><polygon points="'+pts(R)+'" fill="'+shade(col,-.3)+'"/><polygon points="'+pts(T)+'" fill="'+(o.top||shade(col,.22))+'"/>';}
function face(side,cx,cy,sw,h,u1,u2,v1,v2,fill){const a=sw/2,b=sw/4;const P=(u,v)=>side==='L'?[cx-a+u*a,cy+u*b-v*h]:[cx+a-u*a,cy+u*b-v*h];return'<polygon points="'+pts([P(u1,v1),P(u2,v1),P(u2,v2),P(u1,v2)])+'" fill="'+fill+'"/>';}
const tree=(x,y,s)=>{s=s||1;return'<g><rect x="'+(x-3*s)+'" y="'+(y-14*s)+'" width="'+6*s+'" height="'+14*s+'" fill="#7A5230"/><ellipse cx="'+x+'" cy="'+(y-26*s)+'" rx="'+(15*s)+'" ry="'+(16*s)+'" fill="#2E9B4E"/><ellipse cx="'+(x-4*s)+'" cy="'+(y-30*s)+'" rx="'+(8*s)+'" ry="'+(8*s)+'" fill="#47B866"/></g>';};
const silo=(x,y,r,h,col)=>'<g><ellipse cx="'+x+'" cy="'+y+'" rx="'+r+'" ry="'+r/2+'" fill="'+shade(col,-.25)+'"/><rect x="'+(x-r)+'" y="'+(y-h)+'" width="'+2*r+'" height="'+h+'" fill="'+col+'"/><ellipse cx="'+x+'" cy="'+(y-h)+'" rx="'+r+'" ry="'+r/2+'" fill="'+shade(col,.3)+'"/></g>';
const dia=(cx,cy,hw,hh,fill,extra)=>'<polygon points="'+cx+','+(cy-hh)+' '+(cx+hw)+','+cy+' '+cx+','+(cy+hh)+' '+(cx-hw)+','+cy+'" fill="'+fill+'" '+(extra||'')+'/>';

function plaque(cx,cy,d,state,pr){const off=state==='locked'||state==='off';const col=off?'#6F7C86':d.dk;
 const lab=state==='done'?'★ Badge earned':state==='locked'?'🔒 Locked':state==='off'?'Not in this session':pr.done+' of '+pr.total+' missions';
 return'<g><rect x="'+(cx-98)+'" y="'+(cy-24)+'" width="196" height="48" rx="14" fill="'+col+'" stroke="#fff" stroke-width="3"/><text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" class="pl1">'+d.e+' '+d.name.replace(' District','')+'</text><text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" class="pl2">'+lab+'</text></g>';}

function cityMap(preview){
 const stt=DIST.map((d,i)=>preview?'open':dState(i));const nxt=preview?-1:stt.findIndex(s=>s==='open');
 const ga=(d,i)=>preview?'':'data-act="dist" data-v="'+d.id+'" role="button" tabindex="0" aria-label="'+d.name+' – '+(stt[i]==='locked'?'locked':stt[i]==='off'?'not in this session':stt[i]==='done'?'completed':'open')+'"';

 s+='<polygon points="40,300 500,560 500,592 40,332" fill="#7B5A38"/><polygon points="960,300 500,560 500,592 960,332" fill="#5C4126"/><polygon points="500,40 960,300 500,560 40,300" fill="#7CCB6B"/>';
 s+='<g clip-path="url(#gc)"><line x1="270" y1="170" x2="730" y2="430" stroke="#7D8794" stroke-width="46"/><line x1="730" y1="170" x2="270" y2="430" stroke="#7D8794" stroke-width="46"/><line x1="270" y1="170" x2="730" y2="430" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/><line x1="730" y1="170" x2="270" y2="430" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/></g>';
 s+='<g class="car1">'+blk(0,0,22,9,'#E4493B')+'</g><g class="car2">'+blk(0,0,22,9,'#F6C945')+'</g>';
 const grp=(i,inner,cx,cy,plq)=>{const d=DIST[i],sx=stt[i];

 /* North: Food Security */
 let n='';
 n+=silo(560,185,15,52,'#CFE9E7')+silo(586,200,15,42,'#CFE9E7');
 n+=blk(470,180,128,42,'#2BB3AD',{top:'#F6C945'})+face('L',470,180,128,42,.1,.4,.3,.75,'#E8F7F6')+face('L',470,180,128,42,.55,.9,.3,.75,'#E8F7F6')+face('R',470,180,128,42,.15,.8,.05,.55,'#1B7F7A');
 n+=blk(425,212,34,13,'#F6C945')+'<circle cx="418" cy="214" r="4" fill="#333"/><circle cx="436" cy="220" r="4" fill="#333"/>';
 if(has('storage'))n+=blk(540,225,52,26,'#9FD8F2',{top:'#DDF3FC'})+'<text x="540" y="214" text-anchor="middle" font-size="18">❄️</text>'+silo(612,214,13,36,'#CFE9E7');
 /* West: Nutrition */
 let w='';
 w+=tree(205,285)+tree(215,335,.9);
 w+=blk(255,300,112,46,'#F6B26B',{top:'#E8602C'});
 for(let k=0;k<5;k++)w+=face('L',255,300,112,46,k*.2,(k+1)*.2,.62,.84,k%2?'#fff':'#E8602C');
 w+=face('R',255,300,112,46,.2,.5,.08,.5,'#FFF1CF')+face('R',255,300,112,46,.6,.88,.08,.5,'#FFF1CF')+'<text x="255" y="236" text-anchor="middle" font-size="22">🍎</text>';
 w+=blk(318,332,38,16,'#7BC96F')+'<circle cx="312" cy="312" r="5" fill="#E4493B"/><circle cx="324" cy="314" r="5" fill="#F6C945"/>'+blk(296,348,34,14,'#F2C94C')+'<circle cx="290" cy="333" r="5" fill="#9BD16B"/>';
 if(has('market'))w+=blk(214,318,42,22,'#FFE0A6',{top:'#E8602C'})+'<text x="214" y="298" text-anchor="middle" font-size="16">🛒</text>';
 if(has('garden'))w+=dia(325,282,36,18,'#8A5A33')+'<g fill="#3FA94A"><circle cx="305" cy="282" r="5"/><circle cx="318" cy="276" r="5"/><circle cx="331" cy="282" r="5"/><circle cx="344" cy="288" r="5"/><circle cx="325" cy="288" r="5"/></g>'+'<g fill="#F28C28"><circle cx="312" cy="287" r="3"/><circle cx="337" cy="282" r="3"/></g>';
 /* East: Well-being */
 let e='';
 e+=dia(715,320,90,48,'#8BD27A')+'<ellipse cx="715" cy="320" rx="68" ry="34" fill="none" stroke="#C08B5C" stroke-width="7"/>'+'<ellipse cx="715" cy="320" rx="44" ry="20" fill="#6FBF5E"/>';
 e+=tree(660,300,.9)+tree(775,345,.9)+tree(800,300,.8);
 e+=blk(770,282,76,40,'#EAF2FB',{top:'#3E7BDB'})+face('L',770,282,76,40,.2,.8,.25,.7,'#BFD7F6')+'<text x="784" y="285" text-anchor="middle" font-size="22" fill="#E4493B">✚</text>';
 if(has('park'))e+='<rect x="700" y="318" width="30" height="8" fill="#F6C945"/><circle cx="745" cy="322" r="6" fill="#E4493B"/><rect x="684" y="330" width="26" height="6" fill="#3E7BDB"/>'+tree(690,360,.8);
 /* South: Safety */
 let so='';
 so+=blk(515,418,34,56,'#C85A3C')+'<g class="smoke"><circle cx="515" cy="352" r="9" fill="#EEE"/><circle cx="522" cy="338" r="7" fill="#EEE"/></g>';
 so+=blk(470,448,116,46,'#4C6FD1',{top:'#E4493B'})+face('L',470,448,116,46,.12,.42,.22,.72,'#DCE6FF')+face('R',470,448,116,46,.15,.45,.05,.62,'#B2342A')+face('R',470,448,116,46,.6,.88,.28,.7,'#DCE6FF')+'<text x="456" y="396" text-anchor="middle" font-size="22">🧑‍🍳</text>';
 so+=blk(560,468,26,12,'#E4493B')+'<text x="560" y="455" text-anchor="middle" font-size="15">🧯</text>';

 s+=grp(1,n,500,170,plaque(500,70,DIST[1],stt[1],prog('security')));

 s+=grp(3,so,500,430,plaque(500,525,DIST[3],stt[3],prog('safety')));

function vMission(){

 const order=shuffle(r.o.map((_,i)=>i));let first=true,solved=false;
 box.innerHTML='<h3 class="q2">'+r.q+' <span class="bonus">+5 bonus</span></h3><div class="opts">'+order.map(k=>'<button class="opt" data-act="st" data-k="rpick" data-v="'+k+'">'+r.o[k]+'</button>').join('')+'</div>';

  stage.innerHTML='<div class="prog">Decision '+(i+1)+' of '+m.steps.length+'</div><h2 class="q">'+s.q+'</h2><div class="opts">'+order.map(k=>'<button class="opt" data-act="st" data-k="pick" data-v="'+k+'">'+s.o[k]+'</button>').join('')+'</div><div id="reason"></div>';fb('','');

   if(v===s.ok){solved=true;el.classList.add('good');stage.querySelectorAll('#stage>.opts .opt').forEach(b=>b.disabled=true);award(10,'correct decision');const fx=applyFx(s.fx,s.fxWhy);const pre='<b>Yes!</b> '+s.why+fx;

 step();}

/* ---- pick (shelf / tray / park) ---- */
const EV={
 shelf(sel){if(sel.length<5)return{ok:false,msg:'Stock at least 5 different foods so the market has variety.'};
  const g=new Set(sel.filter(id=>!food(id).lim).map(id=>food(id).main));const miss=Object.keys(MAINN).filter(k=>!g.has(k));
  if(miss.length)return{ok:false,msg:'The market has no '+miss.map(k=>MAINN[k].toLowerCase()).join(' or ')+' yet. People need all four kinds of food.'};
  const by=k=>sel.filter(id=>!food(id).lim&&food(id).main===k).map(id=>food(id).n).join(', ');
  return{ok:true,html:'<b>The market is open!</b> It now has foods from every group:<ul style="margin:.3rem 0 0 1.1rem"><li>Carbohydrates (energy): '+by('carb')+'</li><li>Proteins (growth and repair): '+by('protein')+'</li><li>Fats (energy, in small amounts): '+by('fat')+'</li><li>Vitamins and minerals (protection): '+by('vm')+'</li></ul>'+(sel.some(id=>food(id).lim)?'<p>Sweets and fried chips are fine as rare treats, but they do not count as a healthy source of any group.</p>':'')};},
 tray(sel,cap){const ok=sel.filter(id=>!food(id).lim);const g=new Set(ok.map(id=>food(id).main));const lim=sel.length-ok.length;
  const need=[['carb','an energy food (carbohydrates), like rice or whole grains'],['protein','a protein food, like pulses, milk or eggs'],['vm','a fruit or vegetable for vitamins and minerals']].filter(x=>!g.has(x[0]));
  if(need.length)return{ok:false,msg:'This tray is missing '+need.map(x=>x[1]).join(' and ')+'. A balanced meal has variety.'};
  if(lim>1)return{ok:false,msg:'Too many treats on one tray. Sweets and fried chips are fine rarely and in small amounts. Keep at most one.'};
  return{ok:true,html:'<b>A balanced tray!</b> '+sel.map(id=>food(id).e+' '+food(id).n).join(', ')+'.<br>Energy foods give energy, protein foods help the body grow and repair, and fruits or vegetables give vitamins and minerals. Fats are needed in small amounts, and different trays can be just as good.'};},
 park(sel){const bad1=sel.filter(id=>!PARK.find(p=>p.id===id).ok);const good=sel.filter(id=>PARK.find(p=>p.id===id).ok);
  if(bad1.length)return{ok:false,msg:'These do not encourage activity or healthy habits: '+bad1.map(id=>PARK.find(p=>p.id===id).n).join(', ')+'. Take them out and spend the coins on healthier choices.'};
  if(good.length<3)return{ok:false,msg:'Choose at least 3 facilities that help people be active and healthy.'};
  return{ok:true,html:'<b>The park opens!</b> '+good.map(id=>PARK.find(p=>p.id===id).e+' '+PARK.find(p=>p.id===id).n).join(', ')+' give people many ways to be active and learn healthy habits. Every body can benefit.'};}
};
function rPick(m){const cfg=m.pick;const stage=$('#stage');let sel=[],locked=false,info='Tap a card to read about it and add it. Tap again to remove it.';
 const it=id=>cfg.items.find(x=>x.id===id);const spent=()=>sel.reduce((a,id)=>a+(it(id).c||0),0);
 function tg(f){return f.t?'<div class="tg">'+f.t.map(t=>'<em class="'+(t===f.main?'m':'')+'">'+TAGN[t]+'</em>').join('')+'</div>':'';}
 function draw(){const left=cfg.budget!=null?cfg.budget-spent():null;
  stage.innerHTML='<div class="pickbar">'+(cfg.budget!=null?'<span class="coins">🪙 Coins left: <b>'+left+'</b> of '+cfg.budget+'</span>':'')+(cfg.cap?'<span class="coins">🍽️ Tray: <b>'+sel.length+'</b> of '+cfg.cap+'</span>':'')+'</div><div class="tray" aria-label="Chosen items">'+(sel.length?sel.map(id=>'<span class="slot" title="'+it(id).n+'">'+it(id).e+'</span>').join(''):'<span class="mut">Nothing chosen yet</span>')+'</div><div class="foods">'+cfg.items.map(f=>'<button class="food '+(sel.includes(f.id)?'on':'')+'" data-act="st" data-k="tog" data-v="'+f.id+'" aria-pressed="'+sel.includes(f.id)+'" '+(locked?'disabled':'')+'><span class="fe">'+f.e+'</span><b>'+f.n+'</b>'+(f.c!=null?'<span class="cost">🪙 '+f.c+'</span>':'')+tg(f)+'</button>').join('')+'</div><p class="note">'+info+'</p><button class="btn go" data-act="st" data-k="submit" '+(locked?'disabled':'')+'>'+cfg.submit+'</button><div id="reason"></div>';}
 RT.h=(k,v)=>{if(locked)return;
  if(k==='tog'){const f=it(v);const on=sel.includes(v);
   if(on)sel=sel.filter(x=>x!==v);else{if(cfg.cap&&sel.length>=cfg.cap){info='The tray is full. Tap a chosen food to take it off first.';draw();return;}if(cfg.budget!=null&&spent()+f.c>cfg.budget){info='Not enough coins for '+f.n+'. Remove something first.';draw();return;}sel.push(v);}
   info=f.e+' <b>'+f.n+':</b> '+f.note;draw();return;}
  if(k==='submit'){const r=EV[cfg.eval](sel,cfg.cap);
   if(!r.ok){bad();fb('no',r.msg+' <i>Change your choices and try again.</i>');return;}
   locked=true;draw();award(10,'correct decision');
   if(m.reason){fb('ok',r.html);runReason(m.reason,t=>fb('ok',r.html+'<br>'+t+finBtn()));}else fb('ok',r.html+finBtn());}};
 draw();}

/* ---- match ---- */
function rMatch(m){const P=m.pairs;const L=P.map((_,i)=>i),R=shuffle(L);const done=new Set();let sel=null,shake=null;const stage=$('#stage');
 function draw(){const item=(side,i,txt)=>{const d=done.has(i);const s=sel&&sel.side===side&&sel.i===i;return'<button class="mi '+(d?'ok':'')+(s?' sel':'')+(shake&&((shake.l===i&&side==='l')||(shake.r===i&&side==='r'))?' shake':'')+'" data-act="st" data-k="'+side+'" data-v="'+i+'" '+(d?'aria-disabled="true"':'')+'>'+(d?'✔ ':'')+txt+'</button>';};
  stage.innerHTML='<div class="prog">'+done.size+' of '+P.length+' matched</div><div class="cols"><div>'+L.map(i=>item('l',i,P[i].l)).join('')+'</div><div>'+R.map(i=>item('r',i,P[i].r)).join('')+'</div></div>';shake=null;}
 RT.h=(k,v)=>{if(k!=='l'&&k!=='r')return;const i=+v;if(done.has(i))return;
  if(!sel||sel.side===k){sel={side:k,i};draw();return;}
  const li=k==='l'?i:sel.i,ri=k==='r'?i:sel.i;sel=null;
  if(li===ri){done.add(li);award(0);if(done.size===P.length){draw();award(10,'all matched');fb('ok','<b>All matched!</b> '+P[li].why+finBtn());}else{draw();fb('ok','<b>Match!</b> '+P[li].why);}}
  else{bad();shake={l:li,r:ri};draw();fb('no','<b>Not quite.</b> '+P[li].l+' does not go with '+P[ri].r+'. '+(m.wrong||'')+' Try again.');}};
 draw();}

/* ---- sort ---- */
function rSort(m){const items=shuffle(m.items.map((_,i)=>i));const placed={};let sel=null;const stage=$('#stage');
 function draw(){stage.innerHTML='<div class="prog">'+Object.keys(placed).length+' of '+m.items.length+' sorted</div><div class="cols" style="grid-template-columns:1fr 1.2fr"><div>'+items.filter(i=>!(i in placed)).map(i=>'<button class="mi '+(sel===i?'sel':'')+'" draggable="true" data-act="st" data-k="item" data-v="'+i+'">'+m.items[i].t+'<small>'+m.items[i].s+'</small></button>').join('')+'</div><div class="bins">'+m.bins.map(b=>'<button class="bin" data-act="st" data-k="bin" data-v="'+b.id+'"><b>'+b.n+'</b><small>'+b.def+'</small>'+items.filter(i=>placed[i]===b.id).map(i=>'<span class="pl">✔ '+m.items[i].t+'</span>').join('')+'</button>').join('')+'</div></div>';
  stage.querySelectorAll('[draggable]').forEach(el=>el.addEventListener('dragstart',e=>{sel=+el.dataset.v;e.dataTransfer.setData('text/plain',el.dataset.v);}));
  stage.querySelectorAll('.bin').forEach(b=>{b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();const i=+e.dataTransfer.getData('text/plain');if(!isNaN(i))place(i,b.dataset.v);});});}
 function place(i,bid){const it=m.items[i];if(i in placed)return;const b=m.bins.find(x=>x.id===bid);
  if(it.bin===bid){placed[i]=bid;sel=null;draw();if(Object.keys(placed).length===m.items.length){award(10,'all sorted');fb('ok','<b>All sorted!</b> You used the clues to tell the four kinds of disease apart.'+finBtn());}else fb('ok','<b>Yes.</b> '+it.t+' is '+b.n.toLowerCase()+': '+b.def+'.');}
  else{bad();sel=null;draw();fb('no','<b>Not quite.</b> '+b.n+' diseases are '+b.def+'. Does that match this case? Try another group.');}}
 RT.h=(k,v)=>{if(k==='item'){sel=sel===+v?null:+v;draw();}else if(k==='bin'){if(sel===null){fb('info','First tap a case card, then tap its group.');return;}place(sel,v);}};
 draw();}

/* ---- inspect ---- */
function rInspect(m){const S2=m.samples;const done=new Set();let cur=null;const stage=$('#stage');let order=shuffle(CAUSES.map((_,i)=>i));
 function draw(){const s=cur!=null?S2[cur]:null;
  stage.innerHTML='<div class="prog">'+done.size+' of '+S2.length+' causes found</div><div class="samples">'+S2.map((x,i)=>'<button class="smp '+(done.has(i)?'ok':'')+(cur===i?' sel':'')+'" data-act="st" data-k="smp" data-v="'+i+'"><span class="fe">'+x.e+'</span>'+x.n+(done.has(i)?'<br>✔ '+CAUSES[x.ok]:'')+'</button>').join('')+'</div>'+
  (s?'<div class="card2"><b>'+s.e+' Storage card: '+s.n+'</b><p>📍 Stored: '+s.store+'</p><p>⏱️ Time: '+s.time+'</p><p>👀 What changed: '+s.seen+'</p><p class="mut">🚫 Never taste or sniff suspicious food. How food looks cannot prove it is safe, so ask an adult.</p></div>'+(done.has(cur)?'':'<h3 class="q2">What is the most likely cause of spoilage?</h3><div class="causes">'+order.map(k=>'<button class="opt" data-act="st" data-k="cause" data-v="'+k+'">'+CAUSES[k]+'</button>').join('')+'</div>'):'<p class="note">Tap a food sample to read its storage card.</p>');}
 RT.h=(k,v)=>{if(k==='smp'){cur=+v;draw();return;}if(k==='cause'&&cur!=null){const s=S2[cur];if(+v===s.ok){done.add(cur);const wasLast=done.size===S2.length;draw();if(wasLast){award(10,'all causes found');fb('ok','<b>Yes.</b> '+s.why+'<br>Tip: '+s.tip+finBtn());}else fb('ok','<b>Yes.</b> '+s.why+'<br>Tip: '+s.tip);}
   else{bad();fb('no','<b>Not quite.</b> '+CAUSES[+v]+' is not the best match for this card. Re-read how it was stored and what changed.');}}};
 draw();}

function rBMI(m){const stage=$('#stage');const PR=[{w:64,h:1.6,a:25.0},{w:54,h:1.5,a:24.0}];const got=[false,false];let calc='';
 const PEOPLE=[['Fictional adult A',70,1.75],['Fictional adult B',60,1.6],['Fictional adult C',85,1.8]];

function rKitchen(m){const stage=$('#stage');const fixMode=m.mode==='fix';const ks={};KOBJ.forEach(o=>ks[o.id]=fixMode&&o.hz?'haz':'none');const resolved={};let cur=null,locked=false;
 const hz=KOBJ.filter(o=>o.hz);
 function panel(){if(!cur)return'<p class="note">'+(fixMode?'Tap a flashing red hazard to decide what to do.':'Tap an object in the kitchen to inspect it.')+'</p>';const o=KOBJ.find(x=>x.id===cur);
  if(!fixMode){if(ks[cur]!=='none')return'<div class="card2"><b>'+o.n+'</b><p>'+o.desc+'</p><p>'+o.why+'</p></div>';return'<div class="card2"><b>'+o.n+'</b><p>'+o.desc+'</p><div class="row"><button class="btn" data-act="st" data-k="cls" data-v="safe">✅ It is safe</button><button class="btn" data-act="st" data-k="cls" data-v="haz">⚠️ It is a hazard</button></div></div>';}
  if(!o.hz)return'<div class="card2"><b>'+o.n+'</b><p>'+o.desc+'</p><p>This one is safe. No action needed.</p></div>';
  if(resolved[cur])return'<div class="card2"><b>'+o.n+'</b><p>✅ Resolved. '+o.why+'</p></div>';
  return'<div class="card2"><b>'+o.n+'</b><p>'+o.desc+'</p><div class="opts">'+o.order.map(k=>'<button class="opt" data-act="st" data-k="fix" data-v="'+k+'">'+o.fix[k][0]+'</button>').join('')+'</div></div>';}
 KOBJ.forEach(o=>{if(o.hz)o.order=shuffle(o.fix.map((_,i)=>i));});
 function draw(){const cnt=fixMode?Object.keys(resolved).length+' of 4 hazards resolved':Object.values(ks).filter(v=>v!=='none').length+' of 7 objects inspected';
  stage.innerHTML='<div class="prog">'+cnt+'</div>'+kitchenSVG(ks)+'<div class="kpanel">'+panel()+'</div>';}
 RT.h=(k,v)=>{if(locked)return;
  if(k==='obj'){cur=v;draw();return;}
  if(k==='cls'&&cur){const o=KOBJ.find(x=>x.id===cur);const said=v==='haz';
   if(said===!!o.hz){ks[cur]=said?'haz':'safe';draw();const all=Object.values(ks).every(x=>x!=='none');
    if(all){locked=true;award(10,'kitchen inspected');fb('ok','<b>Inspection complete!</b> '+o.why+'<br>You found all 4 hazards and confirmed 3 safe items. Next you will fix the hazards.'+finBtn());}else fb('ok','<b>Right.</b> '+o.why);}
   else{bad();fb('no','<b>Not quite.</b> '+(said?'Nothing here is unsafe. ':'Look again: ')+(o.hz?'Check how the objects around it could cause harm. '+o.desc:'This item is a safety feature, not a danger.')+' Try again.');}return;}
  if(k==='fix'&&cur){const o=KOBJ.find(x=>x.id===cur);if(+v===o.ok){resolved[cur]=1;ks[cur]='fixed';draw();award(10,'hazard resolved');const f=applyFx({safety:3},'A critical hazard was resolved');
    if(Object.keys(resolved).length===4){locked=true;fb('ok','<b>All critical hazards resolved! The kitchen passes inspection. 🎖️</b> '+o.fix[o.ok][1]+f+finBtn());}else fb('ok','<b>Hazard resolved.</b> '+o.fix[o.ok][1]+f);}
   else{bad();fb('no','<b>Not safe.</b> '+o.fix[+v][1]+' The hazard stays flashing until it is handled safely. Try another action.');}}};
 draw();}

/* ---- results ---- */
function vResult(){const rows=FINAL.map(f=>{const w=G.finalRes[f.tag];const lab=w==null?'—':w===0?'✅ Demonstrated first time':'🔁 Demonstrated after practice. Revisit this idea.';return'<tr><td>'+f.tag+'</td><td>'+lab+'</td></tr>';}).join('');
 $('#app').innerHTML=topBar()+'<main class="wrap" style="max-width:56rem"><div class="cert"><div style="font-size:4rem">🏆</div><h1>Healthy City Certificate</h1><p>Awarded to the Chief Science Planner of BioCity'+(S.play==='team'?' ('+G.teamPts.map((p,i)=>'Team '+(i+1)+(S.points?': '+p:'')).join(' · ')+')':'')+' for using science to build a healthy, safe and sustainable community.</p>'+(S.points?'<p><b>⭐ '+G.points+' science points</b></p>':'')+'<table class="ctable"><tbody>'+rows+'</tbody></table><div class="row" style="justify-content:center">'+RES.map(r=>'<span class="chip">'+r.e+' '+r.n+' '+G.res[r.k]+'</span>').join('')+'</div><p class="mut">The ending celebrates your reasoning: what mattered was understanding why each choice works.</p><div class="row no-print" style="justify-content:center"><button class="btn" data-act="city">Back to city</button><button class="btn" data-act="print">🖨️ Print</button><button class="btn" data-act="askreset">Reset for next class</button></div></div></main>';}

/* ---------------- teacher ---------------- */
function ansText(m){if(m.type==='decide')return'<ul>'+m.steps.map(s=>'<li>'+s.q.replace(/<[^>]+>/g,'')+' → <b>'+s.o[s.ok]+'</b>'+(s.reason?' (reason: '+s.reason.o[s.reason.ok]+')':'')+'</li>').join('')+'</ul>';
 if(m.type==='match')return'<ul>'+m.pairs.map(p=>'<li>'+p.l.replace(/<[^>]+>/g,'')+' → <b>'+p.r+'</b></li>').join('')+'</ul>';
 if(m.type==='sort')return'<ul>'+m.items.map(p=>'<li>'+p.t+' → <b>'+BINS.find(b=>b.id===p.bin).n+'</b></li>').join('')+'</ul>';
 if(m.type==='inspect')return'<ul>'+m.samples.map(p=>'<li>'+p.n+' → <b>'+CAUSES[p.ok]+'</b></li>').join('')+'</ul>';
 if(m.type==='shelf')return'Any 5+ foods within 12 coins covering carbohydrates, proteins, fats and vitamins/minerals (sweets and chips do not count).';
 if(m.type==='tray')return'Any tray with an energy food, a protein food and a fruit/vegetable; at most one treat. Fats optional.';
 if(m.type==='park')return'At least 3 of: track, playground, sports ground, lawn, garden, health-education centre. Avoid the sweets stall and sofa lounge.';
 if(m.type==='alloc')return'Any two upgrades that bring waste to 30 or lower, e.g. cold room + dry bins (best), or cold room/dry bins + dates/jam kitchen. Glass walls do not help.';
 if(m.type==='bmi')return'Practice answers: 64 ÷ 1.6² = 25.0; 54 ÷ 1.5² = 24.0.';
 if(m.type==='kitchen')return m.mode==='inspect'?'Hazards: gas cylinder, pan on stove, curtain by stove, mixer on wet counter. Safe: window, extinguisher, first-aid kit.':'Safe actions: move away and alert an adult (gas); alert an adult (pan); adult moves cloth (curtain); adult switches off power with dry hands (mixer).';return'';}
function previewHTML(){return DIST.map(d=>'<h3 style="margin-top:.8rem">'+d.e+' '+d.name+'</h3>'+MISSIONS.filter(m=>m.d===d.id).map(m=>'<div class="pv"><b>'+m.title+'</b> <span class="tag">'+TL[m.type]+'</span><span class="tag">'+(m.tier===1?'10 min+':m.tier===2?'20 min+':'30 min only')+'</span>'+(m.optional?'<span class="tag">Optional</span>':'')+'<br>'+m.obj+'<br>'+ansText(m)+'</div>').join('')).join('')+'<h3 style="margin-top:.8rem">🏆 Final mission</h3>'+FINAL.map(f=>'<div class="pv"><b>'+f.title+'</b><br>'+ansText(f)+'</div>').join('');}
function teacherHTML(){const seg=(k,opts)=>'<div class="seg">'+opts.map(o=>'<button class="'+(S[k]===o[0]?'on':'')+'" data-act="set" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
 const tb=DIST.map(d=>{const p=prog(d.id);return'<tr><td>'+d.e+' '+d.name+'</td><td>'+p.done+' of '+p.total+'</td><td>'+(G.badges[d.id]?'★':'')+'</td></tr>';}).join('');
 const rv=Object.keys(G.review).sort((a,b)=>G.review[b]-G.review[a]).map(t=>'<div class="pv"><b>'+t+'</b> ('+G.review[t]+' misses)<br>'+(TAGS[t]||'')+'</div>').join('')||'<p class="mut">No review items yet.</p>';
 const sk=G.skips.length?'<ul>'+G.skips.map(s=>'<li>'+s.title+' – '+s.reason+'</li>').join('')+'</ul>':'<p class="mut">No skipped missions.</p>';
 return'<h2>⚙️ Teacher settings</h2><div class="fld"><b>Game mode</b>'+seg('mode',[['full','Full game'],['single','One district']])+(S.mode==='single'?'<div style="margin-top:.4rem">'+seg('district',DIST.map(d=>[d.id,d.e+' '+d.name.replace(' District','')]))+'</div>':'')+'</div><div class="fld"><b>Session length</b>'+seg('length',[[10,'10 min'],[20,'20 min'],[30,'30 min']])+'<small class="mut">Shorter sessions use fewer missions per district.</small></div><div class="fld"><b>Play style</b>'+seg('play',[['whole','Whole class'],['team','Teams'],['individual','Individual']])+(S.play==='team'?'<div style="margin-top:.4rem">'+seg('teams',[[2,'2 teams'],[3,'3 teams'],[4,'4 teams'],[5,'5 teams']])+'</div>':'')+'</div><div class="fld"><b>Points shown</b>'+seg('points',[[true,'On'],[false,'Off (discussion mode)']])+'</div><div class="fld"><b>Smart-board mode</b>'+seg('board',[[true,'On (bigger text, fewer controls)'],[false,'Off']])+'</div><div class="row"><button class="btn" data-act="preview">📋 Preview questions and answers</button><button class="btn" data-act="resetRes">Reset resources</button><button class="btn" data-act="askrestart">Restart game</button><button class="btn" data-act="askreset">Reset city for new class</button></div><h3 style="margin-top:1rem">Progress</h3><table class="ctable"><tbody>'+tb+'<tr><td>🏆 Final mission</td><td>'+(G.finalDone?'Done':'—')+'</td><td></td></tr></tbody></table><h3>Skipped missions</h3>'+sk+'<h3 style="margin-top:.8rem">Review items and common misconceptions</h3>'+rv+'<p class="mut" style="margin-top:.8rem">Teacher note: please check the Vitamin E and Vitamin K conditions (weak muscles; slow blood clotting) against your chapter table, and edit if the textbook words them differently.</p><div class="row" style="margin-top:.8rem"><button class="btn go" data-act="applyT">Done</button></div>';}

/* ---------------- actions ---------------- */
const ACT={
 start(){if(!G.seenIntro){G.seenIntro=true;save();UI.ip=0;go('intro');}else go('city');},
 introNext(){if(UI.ip<INTRO.length-1){UI.ip++;render();}else go('city');},
 city(){closeModal();go('city');},
 dist(d){const i=DIST.findIndex(x=>x.id===d.v);const s=dState(i);if(s==='locked'){toast('Earn the '+DIST[i-1].badge+' badge to open this district.');return;}if(s==='off'){toast('This district is not part of this session.');return;}UI.d=d.v;go('district');},
 hall(){if(G.finalDone){go('result');return;}if(S.mode==='full'&&DIST.every(x=>G.badges[x.id])){startFinal();return;}toast(S.mode==='single'?'The final mission is part of the full game.':'Earn all four district badges to unlock the Healthy City Certification.');},
 startM(d){startMission(d.v);},
 hint(){const h=$('#hint');if(!h)return;h.hidden=false;h.textContent='💡 '+(RT.hint||RT.m.hint);},
 pause(){modal('<h2>⏸️ Game paused</h2><p>Your city is saved. Press Resume when you are ready.</p><div class="row"><button class="btn go" data-act="close">▶ Resume</button></div>',false,true);},
 close(){closeModal();},
 teacher(){modal(teacherHTML(),true,true);},
 set(d){let v=d.v;if(v==='true')v=true;else if(v==='false')v=false;else if(!isNaN(v)&&v!=='')v=+v;S[d.k]=v;if(d.k==='play'||d.k==='teams')ensureTeams();save();modal(teacherHTML(),true,true);render();},
 applyT(){closeModal();render();},
 preview(){modal('<h2>Questions and accepted answers</h2>'+previewHTML()+'<div class="row" style="margin-top:.8rem"><button class="btn go" data-act="teacher">← Back to settings</button></div>',true,true);},
 answers(){const m=RT.m;modal('<h2>'+m.title+'</h2><p>'+m.obj+'</p><div class="pv">'+ansText(m)+'</div><div class="row"><button class="btn go" data-act="close">Close</button></div>');},
 skip(){modal('<h2>Skip this mission?</h2><p>Pick a reason. It is recorded in the teacher panel.</p><div class="opts">'+['Short on time','Students need to revisit the topic first','Technical problem','Other'].map(r=>'<button class="opt" data-act="skipdo" data-v="'+r+'">'+r+'</button>').join('')+'</div><div class="row" style="margin-top:.7rem"><button class="btn" data-act="close">Cancel</button></div>');},
 skipdo(d){skipMission(d.v);},
 resetRes(){G.res={...RES0};save();toast('Resources reset.');render();},
 askrestart(){askBox('This clears all mission progress, badges and points, but keeps the teacher settings.','restart');},
 restart(){const s=S;G=newGame();G.seenIntro=true;S=s;save();closeModal();go('city');},
 askreset(){askBox('This resets the whole city, settings, review items and scores for a new class.','resetall');},
 resetall(){G=newGame();S=newSet();save();closeModal();go('welcome');},
 print(){try{window.print();}catch(e){toast('Printing is not available here.');}}
};
function stHandler(k,v,el){if(k==='rpick'&&RT.rs){RT.rs.pick(+v,el);return;}
 if(k==='fin'){if(S.play==='team'){G.turn++;chips();}RT.done&&RT.done();return;}
 if(k==='next'&&S.play==='team'){G.turn++;chips();}
 if(RT.h)RT.h(k,v,el);}
document.addEventListener('click',e=>{
 const bk=e.target.closest('.mback');if(bk&&e.target===bk&&bk.dataset.close==='1'){closeModal();return;}
 const b=e.target.closest('[data-act]');if(!b||b.disabled||b.getAttribute('aria-disabled')==='true')return;
 const a=b.dataset.act;if(a==='st'){stHandler(b.dataset.k,b.dataset.v,b);return;}const f=ACT[a];if(f)f(b.dataset,b);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(e.key==='Escape'){const bk=$('#overlay .mback');if(bk&&bk.dataset.close==='1')closeModal();}});

load();ensureTeams();render();
